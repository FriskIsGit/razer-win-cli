[package]
name = "razer-hid"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "Razer HID protocol library (report codec + transport) for opsrzr"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-native"] }

[dev-dependencies]