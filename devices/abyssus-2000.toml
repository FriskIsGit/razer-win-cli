# Razer Abyssus 2000 (wired mouse)
# source: OpenRazer driver razer_mouse_probe; daemon mouse.py class `RazerAbyssus2000`.

name = "Razer Abyssus 2000"
usb_pid = "0x005E"
device_type = "mouse"
transaction_id = "0xff"
wait_us = 600
dpi_min = 100
dpi_max = 2000
lighting_effects = ["none"]

[capabilities]
lighting = true
dpi = true
dpi_stages = false
polling_rate = true
battery = false

[[led_regions]]
name = "logo"
id = 0x04
