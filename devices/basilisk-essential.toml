# Razer Basilisk Essential (wired mouse)
# source: OpenRazer driver razer_mouse_probe; daemon mouse.py class `RazerBasiliskEssential`.

name = "Razer Basilisk Essential"
usb_pid = "0x0065"
device_type = "mouse"
transaction_id = "0x3f"
wait_us = 600
dpi_min = 100
dpi_max = 6400
matrix_dims = [1, 1]
lighting_effects = ["static", "breathing", "spectrum", "reactive", "none"]

[capabilities]
lighting = true
dpi = true
dpi_stages = true
polling_rate = true
battery = false

[[led_regions]]
name = "logo"
id = 0x04
