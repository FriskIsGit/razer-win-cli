# Razer Basilisk V3 X HyperSpeed (wireless mouse)
# source: OpenRazer driver razer_mouse_probe; daemon mouse.py class `RazerBasiliskV3XHyperSpeed`.

name = "Razer Basilisk V3 X HyperSpeed"
usb_pid = "0x00B9"
device_type = "mouse"
transaction_id = "0x1f"
wait_us = 31000
dpi_min = 100
dpi_max = 18000
lighting_effects = ["static", "breathing", "spectrum", "wave", "reactive", "none"]

[capabilities]
lighting = true
dpi = true
dpi_stages = true
polling_rate = true
battery = true

[[led_regions]]
name = "scroll"
id = 0x01
