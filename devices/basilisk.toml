# Razer Basilisk (wired mouse)
# source: OpenRazer driver razer_mouse_probe; daemon mouse.py class `RazerBasilisk`.

name = "Razer Basilisk"
usb_pid = "0x0064"
device_type = "mouse"
transaction_id = "0x3f"
wait_us = 600
dpi_min = 100
dpi_max = 16000
matrix_dims = [1, 2]
lighting_effects = ["static", "breathing", "spectrum", "reactive", "none"]

[capabilities]
lighting = true
dpi = true
dpi_stages = false
polling_rate = true
battery = false

[[led_regions]]
name = "logo"
id = 0x04

[[led_regions]]
name = "scroll"
id = 0x01
