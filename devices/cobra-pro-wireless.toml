# Razer Cobra Pro (Wireless)
# source: OpenRazer driver razer_mouse_probe; daemon mouse.py class `RazerCobraProWireless`.

name = "Razer Cobra Pro (Wireless)"
usb_pid = "0x00B0"
device_type = "mouse"
transaction_id = "0x1f"
wait_us = 31000
dpi_min = 100
dpi_max = 30000
lighting_effects = ["static", "spectrum", "wave", "none"]

[capabilities]
lighting = true
dpi = true
dpi_stages = true
polling_rate = true
battery = true

[[led_regions]]
name = "logo"
id = 0x04

[[led_regions]]
name = "scroll"
id = 0x01
