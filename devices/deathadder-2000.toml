# Razer DeathAdder 2000 (wired mouse)
# source: OpenRazer driver razer_mouse_probe; daemon mouse.py class `RazerDeathAdder2000`.

name = "Razer DeathAdder 2000"
usb_pid = "0x004F"
device_type = "mouse"
transaction_id = "0xff"
wait_us = 600
dpi_min = 100
dpi_max = 2000
lighting_effects = ["breathing", "none"]

[capabilities]
lighting = true
dpi = true
dpi_stages = false
polling_rate = true
battery = false

[[led_regions]]
name = "logo"
id = 0x04

[[led_regions]]
name = "scroll"
id = 0x01
