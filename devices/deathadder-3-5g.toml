# Razer DeathAdder 3.5G (wired mouse)
# source: OpenRazer driver razer_mouse_probe; daemon mouse.py class `RazerDeathAdder3_5G`.
# TODO: transaction id not listed in the driver; defaulting to 0xFF.

name = "Razer DeathAdder 3.5G"
usb_pid = "0x0016"
device_type = "mouse"
transaction_id = "0xff"
wait_us = 600
dpi_min = 100
dpi_max = 3500
lighting_effects = ["none"]

[capabilities]
lighting = true
dpi = true
dpi_stages = false
polling_rate = true
battery = false

[[led_regions]]
name = "logo"
id = 0x04

[[led_regions]]
name = "scroll"
id = 0x01
