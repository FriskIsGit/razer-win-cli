# Razer DeathAdder Chroma (wired mouse)
# source: OpenRazer driver razer_mouse_probe; daemon mouse.py class `RazerDeathAdderChroma`.

name = "Razer DeathAdder Chroma"
usb_pid = "0x0043"
device_type = "mouse"
transaction_id = "0xff"
wait_us = 600
dpi_min = 100
dpi_max = 10000
lighting_effects = ["static", "breathing", "spectrum", "none"]

[capabilities]
lighting = true
dpi = true
dpi_stages = false
polling_rate = true
battery = false

[[led_regions]]
name = "logo"
id = 0x04

[[led_regions]]
name = "scroll"
id = 0x01
