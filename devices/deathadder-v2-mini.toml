# Razer DeathAdder V2 Mini (wired mouse)
# source: OpenRazer daemon hardware/mouse.py class `RazerDeathAdderV2Mini`
#   USB_VID = 0x1532, USB_PID = 0x008C, DPI_MAX = 8500, HAS_MATRIX = True,
#   MATRIX_DIMS = [1, 1] (single logo LED; no scroll-wheel LED on this model).
#   METHODS confirms lighting (set_logo_static/spectrum/none/reactive/
#   breath_random/breath_single/breath_dual + custom-frame) and polling rate
#   (get_poll_rate/set_poll_rate); no battery methods (wired-only device).
# source: transaction_id 0x3F — OpenRazer driver/razermouse_driver.c switch
#   tables (razer_attr_read_device_serial / read_firmware_version /
#   write_dpi cases for USB_DEVICE_ID_RAZER_DEATHADDER_V2_MINI all use 0x3f).
# source: wait 600 µs — Phase 0 timing table (wired mice default); no
#   device-specific override found in razermouse_driver.c.
# source: dpi_min 100 — protocol-level clamp floor, razerchromacommon.c
#   `razer_chroma_misc_set_dpi_xy()` (`clamp(dpi_x/y, 100, 45000)`), not a
#   device-specific value (daemon mouse.py only publishes DPI_MAX per device).

name = "Razer DeathAdder V2 Mini"
usb_pid = "0x008C"
device_type = "mouse"
transaction_id = "0x3f"
wait_us = 600
dpi_min = 100
dpi_max = 8500
matrix_dims = [1, 1]

[capabilities]
lighting = true
dpi = true
polling_rate = true
battery = false

[[led_regions]]
name = "logo"
id = 0x04
