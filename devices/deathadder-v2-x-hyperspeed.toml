# Razer DeathAdder V2 X HyperSpeed (wireless mouse)
# source: OpenRazer driver razer_mouse_probe; daemon mouse.py class `RazerDeathAdderV2XHyperSpeed`.
# TODO: lighting optimistically assumed (no OpenRazer data); needs real-world testing.

name = "Razer DeathAdder V2 X HyperSpeed"
usb_pid = "0x009C"
device_type = "mouse"
transaction_id = "0x1f"
wait_us = 31000
dpi_min = 100
dpi_max = 14000
lighting_effects = ["static", "breathing", "spectrum", "wave", "reactive", "none"]

[capabilities]
lighting = true
dpi = true
dpi_stages = true
polling_rate = true
battery = true

[[led_regions]]
name = "matrix"
id = 0x00
