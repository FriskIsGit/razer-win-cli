# Razer DeathAdder V2 (wired mouse)
# source: OpenRazer daemon hardware/mouse.py class `RazerDeathAdderV2`
#   USB_PID = 0x0084, DPI_MAX = 20000, wired (no battery).
#   LED zones: logo + scroll wheel (razercommon.h LED ids logo 0x04, scroll 0x01).
# source: transaction_id 0x3F — Phase 0 grouping (Lancehead/Basilisk/DeathAdder V2
#   era) transcribed from razermouse_driver.c switch tables.
# source: wait 600 µs — Phase 0 timing table (wired mice default).

name = "Razer DeathAdder V2"
usb_pid = "0x0084"
device_type = "mouse"
transaction_id = "0x3f"
wait_us = 600
dpi_min = 100
dpi_max = 20000

[capabilities]
lighting = true
dpi = true
polling_rate = true
battery = false

[[led_regions]]
name = "logo"
id = 0x04

[[led_regions]]
name = "scroll"
id = 0x01
