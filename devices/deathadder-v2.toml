# Razer DeathAdder V2 (wired mouse)
# source: OpenRazer daemon hardware/mouse.py class `RazerDeathAdderV2`
#   USB_PID = 0x0084, DPI_MAX = 20000, wired (no battery).
#   LED zones: logo + scroll wheel (razercommon.h LED ids logo 0x04, scroll 0x01).
# source: transaction_id 0x3F — Phase 0 grouping (Lancehead/Basilisk/DeathAdder V2
#   era) transcribed from razermouse_driver.c switch tables.
# source: wait 600 µs — Phase 0 timing table (wired mice default).
# No firmware support for the DPI-stages command (0x04/0x06/0x86); this
# mouse only supports direct X/Y DPI. Synapse's "sensitivity stages" for
# this device are emulated by the app rewriting the direct DPI value.

name = "Razer DeathAdder V2"
usb_pid = "0x0084"
device_type = "mouse"
transaction_id = "0x3f"
wait_us = 600
dpi_min = 100
dpi_max = 20000
lighting_effects = ["static", "breathing", "spectrum", "reactive", "none"]
# TODO custom

[capabilities]
lighting = true
dpi = true
dpi_stages = false
polling_rate = true
battery = false

[[led_regions]]
name = "logo"
id = 0x04

[[led_regions]]
name = "scroll"
id = 0x01
