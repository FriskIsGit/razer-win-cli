# Razer DeathAdder V3 (wired mouse)
# source: OpenRazer driver razer_mouse_probe; daemon mouse.py class `RazerDeathAdderV3`.
# TODO: lighting optimistically assumed (no OpenRazer data); needs real-world testing.

name = "Razer DeathAdder V3"
usb_pid = "0x00B2"
device_type = "mouse"
transaction_id = "0x1f"
wait_us = 600
dpi_min = 100
dpi_max = 30000
lighting_effects = ["static", "breathing", "spectrum", "wave", "reactive", "none"]

[capabilities]
lighting = true
dpi = true
dpi_stages = true
polling_rate = true
battery = false

[[led_regions]]
name = "matrix"
id = 0x00
