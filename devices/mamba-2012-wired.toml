# Razer Mamba 2012 (Wired)
# source: OpenRazer driver razer_mouse_probe; daemon mouse.py class `RazerMamba2012Wired`.

name = "Razer Mamba 2012 (Wired)"
usb_pid = "0x0024"
device_type = "mouse"
transaction_id = "0xff"
wait_us = 600
dpi_min = 100
dpi_max = 6400
lighting_effects = ["static", "spectrum", "none"]

[capabilities]
lighting = true
dpi = true
dpi_stages = false
polling_rate = true
battery = true

[[led_regions]]
name = "scroll"
id = 0x01
