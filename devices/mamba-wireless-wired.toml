# Razer Mamba Wireless (Wired)
# source: OpenRazer driver razer_mouse_probe; daemon mouse.py class `RazerMambaWirelessWired`.

name = "Razer Mamba Wireless (Wired)"
usb_pid = "0x0073"
device_type = "mouse"
transaction_id = "0x3f"
wait_us = 31000
dpi_min = 100
dpi_max = 16000
matrix_dims = [1, 16]
lighting_effects = ["static", "breathing", "spectrum", "reactive", "none"]

[capabilities]
lighting = true
dpi = true
dpi_stages = false
polling_rate = true
battery = true

[[led_regions]]
name = "logo"
id = 0x04

[[led_regions]]
name = "scroll"
id = 0x01
