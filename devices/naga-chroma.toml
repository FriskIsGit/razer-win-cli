# Razer Naga Chroma (wired mouse)
# source: OpenRazer driver razer_mouse_probe; daemon mouse.py class `RazerNagaChroma`.

name = "Razer Naga Chroma"
usb_pid = "0x0053"
device_type = "mouse"
transaction_id = "0xff"
wait_us = 600
dpi_min = 100
dpi_max = 16000
matrix_dims = [1, 3]
lighting_effects = ["static", "breathing", "spectrum", "reactive", "none"]

[capabilities]
lighting = true
dpi = true
dpi_stages = false
polling_rate = true
battery = false

[[led_regions]]
name = "logo"
id = 0x04

[[led_regions]]
name = "scroll"
id = 0x01

[[led_regions]]
name = "backlight"
id = 0x05
