# Razer Naga Epic (wireless mouse)
# source: OpenRazer driver razer_mouse_probe; daemon mouse.py class `RazerNagaEpic`.

name = "Razer Naga Epic"
usb_pid = "0x001F"
device_type = "mouse"
transaction_id = "0xff"
wait_us = 600
dpi_min = 100
dpi_max = 5600
lighting_effects = ["static", "spectrum", "none"]

[capabilities]
lighting = true
dpi = true
dpi_stages = false
polling_rate = true
battery = true

[[led_regions]]
name = "scroll"
id = 0x01
