# Razer Naga Left-Handed Edition (wired mouse)
# source: OpenRazer driver razer_mouse_probe; daemon mouse.py class `RazerNagaLeftHanded2020`.

name = "Razer Naga Left-Handed Edition"
usb_pid = "0x008D"
device_type = "mouse"
transaction_id = "0x1f"
wait_us = 600
dpi_min = 100
dpi_max = 20000
matrix_dims = [1, 3]
lighting_effects = ["static", "breathing", "spectrum", "wave", "reactive", "none"]

[capabilities]
lighting = true
dpi = true
dpi_stages = false
polling_rate = true
battery = false

[[led_regions]]
name = "logo"
id = 0x04

[[led_regions]]
name = "scroll"
id = 0x01

[[led_regions]]
name = "right"
id = 0x10
