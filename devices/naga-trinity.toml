# Razer Naga Trinity (wired mouse)
# source: OpenRazer driver razer_mouse_probe; daemon mouse.py class `RazerNagaTrinity`.

name = "Razer Naga Trinity"
usb_pid = "0x0067"
device_type = "mouse"
transaction_id = "0xff"
wait_us = 600
dpi_min = 100
dpi_max = 16000
lighting_effects = ["static"]

[capabilities]
lighting = true
dpi = true
dpi_stages = false
polling_rate = true
battery = false

[[led_regions]]
name = "matrix"
id = 0x00
