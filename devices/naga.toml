# Razer Naga (wired mouse)
# source: OpenRazer driver razer_mouse_probe; daemon mouse.py class `RazerNaga`.

name = "Razer Naga"
usb_pid = "0x0015"
device_type = "mouse"
transaction_id = "0xff"
wait_us = 600
dpi_min = 100
dpi_max = 5600
lighting_effects = ["none"]

[capabilities]
lighting = true
dpi = true
dpi_stages = false
polling_rate = true
battery = false

[[led_regions]]
name = "logo"
id = 0x04

[[led_regions]]
name = "scroll"
id = 0x01

[[led_regions]]
name = "backlight"
id = 0x05
