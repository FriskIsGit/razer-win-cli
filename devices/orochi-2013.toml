# Razer Orochi 2013 (wired mouse)
# source: OpenRazer driver razer_mouse_probe; daemon mouse.py class `RazerOrochi2013`.

name = "Razer Orochi 2013"
usb_pid = "0x0039"
device_type = "mouse"
transaction_id = "0xff"
wait_us = 600
dpi_min = 100
dpi_max = 6400
lighting_effects = ["none"]

[capabilities]
lighting = true
dpi = true
dpi_stages = false
polling_rate = true
battery = false

[[led_regions]]
name = "scroll"
id = 0x01
