# Razer Taipan (wired mouse)
# source: OpenRazer driver razer_mouse_probe; daemon mouse.py class `RazerTaipan`.

name = "Razer Taipan"
usb_pid = "0x0034"
device_type = "mouse"
transaction_id = "0xff"
wait_us = 600
dpi_min = 100
dpi_max = 8200
lighting_effects = ["none"]

[capabilities]
lighting = true
dpi = true
dpi_stages = false
polling_rate = true
battery = false

[[led_regions]]
name = "logo"
id = 0x04

[[led_regions]]
name = "scroll"
id = 0x01
